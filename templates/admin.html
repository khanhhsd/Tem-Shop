{% extends "base.html" %}
{% block title %}Store admin | Tem Shop{% endblock %}
{% block content %}
<main class="page-main admin-main">
  <section class="page-heading"><p class="eyebrow">LOCAL STORE TOOLS</p><h1>Product admin</h1></section>
  <section class="admin-panel">
    <h2>Add a product</h2>
    <form class="admin-product-form" action="{{ url_for('admin_add_product') }}" method="post">
      <label>Name<input name="name" required maxlength="160"></label>
      <label>Description<input name="description" required maxlength="500"></label>
      <label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.category_id }}">{{ category.name }}</option>{% endfor %}</select></label>
      <label>Color<input name="color" maxlength="60"></label>
      <label>Price ($)<input type="number" name="price" min="0" step="0.01" required></label>
      <label>Stock<input type="number" name="stock" min="0" step="1" required></label>
      <label>Product image<select name="image_file" required>{% for image in image_files %}<option value="{{ image }}">{{ image }}</option>{% endfor %}</select></label>
      <button class="submit-button" type="submit">Add product</button>
    </form>
  </section>
  <section class="admin-panel">
    <h2>Update stock</h2>
    <div class="stock-list">{% for product in products %}
      <form class="stock-row" action="{{ url_for('admin_update_stock', product_id=product.id) }}" method="post">
        <img src="{{ url_for('static', filename=product.image) }}" alt="">
        <span>{{ product.name }}</span><label>Stock <input type="number" name="stock" min="0" value="{{ product.stock }}" required></label><button type="submit">Save</button>
      </form>
    {% endfor %}</div>
  </section>
</main>
{% endblock %}
